[package]
name = "local-agent-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
gray_matter = "0.2"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "http2",
] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
remote = ["reqwest/rustls-tls"]

# Test support only: spawned by integration tests, never by the harness runtime.
[[bin]]
name = "mock_mcp_server"
path = "tests/support/mock_mcp_server.rs"
test = false
